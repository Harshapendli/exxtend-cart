<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2351"/>
      <stop offset="100%" style="stop-color:#1a4a8a"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D9E75"/>
      <stop offset="100%" style="stop-color:#2bbf8e"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)" rx="16"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="80" r="120" fill="#ffffff" opacity="0.03"/>
  <circle cx="720" cy="60" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="80" cy="420" r="100" fill="#1D9E75" opacity="0.1"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accent1)" rx="3"/>

  <!-- EXTEND KART logo area -->
  <rect x="30" y="20" width="180" height="36" fill="rgba(255,255,255,0.1)" rx="8"/>
  <text x="46" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#1D9E75">EXTEND</text>
  <text x="108" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#f59e0b"> KART</text>

  <!-- Service badge -->
  <rect x="30" y="80" width="200" height="32" fill="url(#accent1)" rx="16"/>
  <text x="56" y="101" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" letter-spacing="2">✈ PASSPORT SERVICES</text>

  <!-- Main title -->
  <text x="30" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white">PASSPORT</text>
  <text x="30" y="215" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white">APPLICATION</text>
  <text x="30" y="260" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.6)">New &amp; Renewal — Normal &amp; Tatkaal</text>

  <!-- Price boxes -->
  <rect x="30" y="290" width="220" height="80" fill="rgba(255,255,255,0.08)" rx="12" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="50" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">NORMAL</text>
  <text x="50" y="352" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#2bbf8e">₹3,100</text>

  <rect x="270" y="290" width="220" height="80" fill="rgba(255,255,255,0.08)" rx="12" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="290" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">TATKAAL (URGENT)</text>
  <text x="290" y="352" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#fbbf24">₹6,000</text>

  <!-- Requirements list -->
  <rect x="540" y="100" width="230" height="280" fill="rgba(255,255,255,0.06)" rx="12"/>
  <text x="560" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2bbf8e" letter-spacing="1.5">DOCUMENTS NEEDED</text>
  <line x1="560" y1="140" x2="750" y2="140" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="576" y="165" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  Aadhaar Card</text>
  <text x="576" y="190" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  PAN Card</text>
  <text x="576" y="215" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  Birth Proof / 10th</text>
  <text x="576" y="240" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  Photos (White BG)</text>
  <text x="576" y="265" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  Address Proof</text>
  <text x="576" y="290" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  Voter ID / Ration Card</text>
  <text x="576" y="315" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  Old Passport (renewal)</text>
  <text x="576" y="340" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">✓  Marriage Cert (if appl.)</text>

  <!-- Passport icon -->
  <rect x="540" y="20" width="50" height="65" fill="#1a3a6a" rx="6" stroke="#2a5a9a" stroke-width="2"/>
  <circle cx="565" cy="45" r="12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="555" y="49" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b" font-weight="700">IND</text>
  <text x="548" y="72" font-family="Arial, sans-serif" font-size="6" fill="#f59e0b">PASSPORT</text>

  <!-- Bottom bar -->
  <rect x="0" y="400" width="800" height="100" fill="rgba(0,0,0,0.3)" rx="0"/>
  <rect x="0" y="400" width="800" height="3" fill="url(#gold1)"/>

  <!-- Contact info -->
  <text x="50" y="435" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1">VISIT US</text>
  <text x="50" y="458" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Opp. Filter Bed, Deshaipet Road, Warangal</text>

  <text x="50" y="485" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1">CALL NOW</text>
  <rect x="130" y="473" width="130" height="26" fill="url(#accent1)" rx="13"/>
  <text x="148" y="491" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white">📞 9951119995</text>

  <!-- Trust badge -->
  <rect x="580" y="425" width="190" height="50" fill="rgba(29,158,117,0.15)" rx="10" stroke="#1D9E75" stroke-width="1"/>
  <text x="605" y="448" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#2bbf8e" letter-spacing="1">100% GOVT COMPLIANT</text>
  <text x="616" y="466" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Fast • Reliable • Secure</text>
</svg>
